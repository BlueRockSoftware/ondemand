# This action runs when a new PR is opened and will add labels to the PR
# if the files changed glob match any of the defined rules in .github/labeler.yml
name: Pull Request Labeler

# Fork: auto-labeling is disabled. Upstream relies on an OSC org secret/label
# set this fork doesn't have, so the "Add labels to PR" check failed on every
# PR with no value to us. Left as manual-only (workflow_dispatch) rather than
# deleted, so it can be re-enabled if the fork ever defines its own labels.
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  triage:
    name: Add labels to PR
    runs-on: ubuntu-latest
    steps:
    # Upstream uses secrets.OSC_ROBOT_GH_PUB_REPO_TOKEN (an OSC org secret not
    # present in this fork), so the step always failed with "Parameter token or
    # opts.auth is required". Use the built-in GITHUB_TOKEN, which on
    # pull_request_target has the pull-requests:write permission granted above.
    - uses: actions/labeler@v4.3.0
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        configuration-path: .github/labeler.yml
        sync-labels: true # Revert the labels applied to the PR when changes are reverted.
