---
# Full-lockdown egress policy for sessions started with allow_outbound=false
# ("no internet at all"). Allows ONLY DNS and the API-server lookup the session
# init container needs -- deliberately NOT general in-cluster traffic.
#
# Why no pod/service-CIDR allowance (unlike deny-egress-restricted): the
# egress-proxy is an in-cluster pod (its IP is in the pod CIDR), so allowing the
# pod/service CIDRs lets a locked session reach the proxy (<svc>:3128 -> proxy
# pod) and CONNECT-tunnel to the Posit Package Manager -- defeating "no
# internet". Calico evaluates egress against the POST-DNAT pod IP, so a broad
# pod-CIDR rule covers the proxy even without an explicit :3128 rule (simply
# omitting the proxy rule from deny-egress-restricted was NOT enough). Limiting
# locked egress to DNS + API keeps sessions starting while truly blocking the
# proxy. Verified: a locked pod's curl to egress-proxy:3128 times out, while DNS
# resolution and the API lookup still succeed.
#
# Mutually exclusive with deny-egress-restricted via distinct pod labels
# (ood-outbound-locked vs ood-outbound-restricted), never both on one pod.
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  namespace: $NAMESPACE
  name: deny-egress-locked
spec:
  podSelector:
    matchLabels:
      ood-outbound-locked: "true"
  policyTypes:
  - Egress
  egress:
  # DNS to any resolver (the response is allowed by conntrack). No destination
  # restriction so resolution works regardless of the kube-dns ClusterIP/backend.
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # In-cluster Kubernetes API server. The session init container
  # (get_host_port.py) reads its Service/ConfigMap to discover the connection
  # host:port; without this a locked session never starts. The API ClusterIP
  # (10.96.0.1:443) DNATs to a control-plane node IP on :6443, and Calico
  # evaluates egress against that post-DNAT node IP, so the node subnet must be
  # allowed on :6443. NETWORK_POLICY_ALLOW_API_CIDR defaults to POD_CIDR when a
  # cluster sets no API_SERVER_CIDR; even then only :6443 is opened, so the
  # egress-proxy (a different port, :3128) stays blocked.
  - to:
    - ipBlock:
        cidr: $NETWORK_POLICY_ALLOW_API_CIDR
    ports:
    - protocol: TCP
      port: 6443
